<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blessed Studios | Fan Love ❤️</title>
    <style>
        body {
            background: linear-gradient(130deg, #0a192f, #112240, #0a192f);
            background-size: 400% 400%;
            animation: bg 8s infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            margin: 0;
        }

        @keyframes bg {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 360px;
            z-index: 10;
        }

        h2 { color: #0a192f; margin-bottom: 20px; }

        button {
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        #yes {
            background: #64ffda;
            color: #0a192f;
            box-shadow: 0 4px 15px rgba(100, 255, 218, 0.4);
        }

        #no {
            background: #222;
            color: white;
            position: absolute;
        }

        .heart {
            position: absolute;
            font-size: 25px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 3s ease-in forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>

<body>

<div class="card" id="app">
    <h2>Will you support <br>Blessed Studios? ❤️</h2>
    <button id="yes" onclick="showSuccess()">YES</button>
    <button id="no" onmouseover="moveNo()" ontouchstart="moveNo()">NO</button>
</div>

<script>
    // 1. The "No" button runs away
    function moveNo() {
        const no = document.getElementById("no");
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        no.style.left = x + "px";
        no.style.top = y + "px";
    }

    // 2. The Success Screen (No database, just pure interaction)
    function showSuccess() {
        const app = document.getElementById("app");
        app.innerHTML = `
            <h2 style="color: #0a192f;">You are Amazing! ❤️</h2>
            <p style="color: #444;">Thank you for believing in the vision of Blessed Studios.</p>
            <button id="yes" onclick="window.location.href='index.html'">BACK TO SITE</button>
        `;
        startHearts();
    }

    // 3. Floating Hearts Effect
    function startHearts() {
        for(let i=0; i<40; i++) {
            setTimeout(createHeart, i * 100);
        }
    }

    function createHeart() {
        const h = document.createElement("div");
        h.className = "heart";
        h.innerHTML = Math.random() > 0.5 ? "❤️" : "🎬";
        h.style.left = Math.random() * 100 + "vw";
        h.style.top = "100vh";
        document.body.appendChild(h);
        
        // Cleanup after animation ends
        setTimeout(() => h.remove(), 3000);
    }
</script>

</body>
      </html>
