<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Be My Valentine ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
  background: linear-gradient(130deg,#ff5f6d,#ffc371,#ff5f6d);
  background-size:400% 400%;
  animation: bg 8s infinite;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  overflow:hidden;
}

@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.card{
  background:white;
  padding:20px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 25px rgba(0,0,0,0.2);
  animation: pop .8s ease;
  width:90%;
  max-width:360px;
}

button{
  padding:12px 25px;
  margin:10px;
  border:none;
  border-radius:30px;
  font-size:18px;
  cursor:pointer;
  transition:.3s;
}

#yes{
  background:#ff2e63;
  color:white;
  box-shadow:0 0 15px #ff2e63;
}

#no{
  background:#222;
  color:white;
  position:absolute;
}

.heart{
  position:absolute;
  animation: float 3s infinite;
}

@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-30px)}
  100%{transform:translateY(0)}
}
</style>
</head>

<body>

<div class="card" id="app"></div>

<script>
// ====== SUPABASE SETUP ======
const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_ANON_KEY";
const db = supabase.createClient(supabaseUrl, supabaseKey);

// simple device id
let device = localStorage.getItem("v_id") ||
             Math.random().toString(36).slice(2);
localStorage.setItem("v_id", device);

// save choice
async function save(choice, stage){
 await db.from("valentine_clicks").insert({
   device: device,
   choice: choice,
   stage: stage
 });
}

// ===== PAGES =====

function page1(){
 app.innerHTML = `
  <h2>Will you be my Valentine? ❤️</h2>
  <button id="yes" onclick="yes('stage1')">YES</button>
  <button id="no">NO</button>
 `;
 trapNo("stage1");
}

function page2(){
 app.innerHTML = `
  <h2>Please be my Valentine 🥺</h2>
  <button id="yes" onclick="yes('stage2')">YES</button>
  <button id="no">NO</button>
 `;
 trapNo("stage2");
}

function page3(){
 app.innerHTML = `
  <h2>For the last time...<br>Be my Valentine 💔</h2>
  <button id="yes" onclick="yes('stage3')">YES</button>
  <button id="no">NO</button>
 `;
 trapNo("stage3");
}

// ===== LOGIC =====

function trapNo(stage){
 const no = document.getElementById("no");

 // run away on hover & touch
 no.onmouseover = move;
 no.onclick = ()=> forcedNo(stage);
 no.ontouchstart = move;
}

function move(){
 const no = document.getElementById("no");
 no.style.left = Math.random()*80 + "vw";
 no.style.top  = Math.random()*80 + "vh";
}

function forcedNo(stage){
 save("NO", stage);

 if(stage=="stage1") page2();
 else if(stage=="stage2") page3();
 else page3();
}

function yes(stage){
 save("YES", stage);

 app.innerHTML = `
 <h2>You made my heart smile ❤️</h2>
 <p>
 I choose you today,<br>
 tomorrow and forever 🥰
 </p>
 `;

 hearts();
}

// hearts effect
function hearts(){
 for(let i=0;i<30;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.top=Math.random()*100+"vh";
  document.body.appendChild(h);
 }
}

// start
page1();
</script>

</body>
  </html>
